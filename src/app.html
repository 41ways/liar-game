<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a0e45">
<title>라이어 게임</title>
<style>
/*@FONTS@*/
:root{
 --ink:#1b1038;--ink2:#2c1d5c;
 --paper:#fff8ec;--paper2:#f2e4c9;--paper3:#e6d3ae;
 --yel:#ffc928;--yel-d:#e29c00;
 --red:#ff4766;--red-d:#c41a3d;
 --org:#ff9c2e;--org-d:#cf6900;
 --blu:#33bdff;--blu-d:#0880c4;
 --grn:#3ee08f;--grn-d:#13a05a;
 --pur:#8b6cff;
 --acc:var(--red);--acc-d:var(--red-d);
 --disp:'Display','Pretendard','Malgun Gothic',sans-serif;
 --body:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
body.m-liar{--acc:var(--red);--acc-d:var(--red-d)}
body.m-fool{--acc:var(--org);--acc-d:var(--org-d)}
body.m-spy{--acc:var(--blu);--acc-d:var(--blu-d)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:#fff;font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;background:#140a35;overflow-x:hidden;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
/* 배경: 무대 조명 + 비스듬한 줄무늬 */
.bg{position:fixed;inset:0;z-index:-1;background:
 radial-gradient(120% 70% at 50% -8%,#6a43e0 0%,#3a1f97 32%,#1e0f55 62%,#120830 100%)}
.bg::before{content:"";position:absolute;inset:0;opacity:.07;background:repeating-linear-gradient(-45deg,#fff 0 14px,transparent 14px 40px)}
.bg::after{content:"";position:absolute;left:50%;top:-10%;width:140%;height:80%;transform:translateX(-50%);
 background:radial-gradient(closest-side,rgba(255,236,170,.22),transparent);pointer-events:none}
#app{max-width:480px;margin:0 auto;padding:12px 16px 120px;min-height:100vh;min-height:100dvh;position:relative}
.scr{animation:scrIn .32s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes scrIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* 글자 */
.disp{font-family:var(--disp);font-weight:400;letter-spacing:-.5px;line-height:1.1}
.ol{text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 6px 0 var(--ink)}
.ol-s{text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),1.5px 1.5px var(--ink),-1.5px -1.5px var(--ink),1.5px -1.5px var(--ink),-1.5px 1.5px var(--ink),0 4px 0 var(--ink)}
.muted{color:#7a6ba8}
.center{text-align:center}

/* 버튼 */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:15px 18px 17px;
 font-family:var(--disp);font-size:23px;color:var(--ink);letter-spacing:-.3px;cursor:pointer;
 background:var(--acc);border:3px solid var(--ink);border-radius:20px;
 box-shadow:0 7px 0 var(--ink),inset 0 -7px 0 rgba(0,0,0,.16),inset 0 3px 0 rgba(255,255,255,.5);
 transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.16),inset 0 3px 0 rgba(255,255,255,.5)}
.btn.yel{background:var(--yel)}
.btn.paper{background:var(--paper)}
.btn.grn{background:var(--grn)}
.btn.red{background:var(--red);color:#fff}
.btn.red .lbl,.btn.dark .lbl{text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.dark{background:#4a3a8f;color:#fff}
.btn.sm{font-size:18px;padding:11px 12px 13px;border-radius:16px;margin-top:10px}
.btn[disabled]{filter:grayscale(.8) brightness(.8);pointer-events:none}
.btn svg{width:22px;height:22px;flex:none}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.ibtn{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;
 background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--ink);padding:0}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ibtn svg{width:22px;height:22px}

/* 상단 HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 18px}
.hud .mid{flex:1;text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 14px 6px;font-family:var(--disp);font-size:17px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.pill i{font-style:normal;color:var(--acc)}
.hudtitle{font-family:var(--disp);font-size:24px}

/* 패널 */
.panel{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:24px;padding:22px 16px 16px;margin:26px 0 0;
 box-shadow:0 7px 0 var(--ink),inset 0 -5px 0 var(--paper2)}
.panel.first{margin-top:14px}
.ptab{position:absolute;top:-17px;left:14px;background:var(--ink);color:#fff;font-family:var(--disp);font-size:16px;padding:5px 14px 6px;border-radius:12px;letter-spacing:.2px}
.ptab.acc{background:var(--acc);color:var(--ink);border:3px solid var(--ink);top:-19px}
.panel p{margin:4px 0}
.panel .sub{color:#6e5f95;font-size:14.5px}
.hint{font-size:14px;color:#6e5f95;margin-top:10px;line-height:1.5}
.hint b{color:var(--ink)}

/* 타이틀 */
.title{position:relative;min-height:calc(100dvh - 40px);display:flex;flex-direction:column;align-items:center;padding-top:4vh}
.logo{position:relative;text-align:center;margin-top:10px}
.logo .en{display:inline-block;font-family:var(--disp);font-size:15px;letter-spacing:6px;color:var(--ink);background:var(--yel);border:3px solid var(--ink);padding:3px 10px 4px 16px;border-radius:8px;transform:rotate(-4deg);box-shadow:0 4px 0 var(--ink)}
.logo .ko{font-family:var(--disp);font-size:92px;line-height:1;color:var(--yel);margin-top:8px;transform:rotate(-3deg);
 text-shadow:5px 0 var(--ink),-5px 0 var(--ink),0 5px var(--ink),0 -5px var(--ink),4px 4px var(--ink),-4px -4px var(--ink),4px -4px var(--ink),-4px 4px var(--ink),0 11px 0 var(--ink),4px 11px 0 var(--ink),-4px 11px 0 var(--ink)}
.logo .ko span{color:#fff}
.logo .game{position:absolute;right:-14px;bottom:-14px;font-family:var(--disp);font-size:30px;color:#fff;background:var(--red);border:3px solid var(--ink);border-radius:14px;padding:2px 12px 5px;transform:rotate(6deg);box-shadow:0 5px 0 var(--ink)}
.lineup{display:flex;align-items:flex-end;justify-content:center;margin:34px 0 4px;position:relative}
.lineup::before{content:"";position:absolute;bottom:-6px;left:8%;right:8%;height:22px;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent)}
.lineup .a{width:96px;margin:0 -8px;animation:bob 2.4s ease-in-out infinite}
.lineup .a.c{width:132px;z-index:1;animation-delay:-.6s}
.lineup .a:last-child{animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-6px)}}
.tagline{font-weight:700;font-size:16px;margin:16px 0 4px;color:#e9e2ff;text-align:center}
.modes3{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.modes3 span{font-family:var(--disp);font-size:13px;padding:3px 9px 4px;border-radius:8px;border:2px solid var(--ink);color:var(--ink)}
.title .btns{width:100%;margin-top:auto;padding-top:20px}
.foot{display:flex;justify-content:center;gap:14px;margin-top:22px}
.ver{font-size:12px;color:#8d7fc4;margin-top:14px;text-align:center}

/* 아바타 */
.av{display:block;width:100%;height:auto;overflow:visible}
.av .pp{transition:transform .3s}
.shifty .pp{animation:shifty 3s infinite}
@keyframes shifty{0%,30%{transform:translateX(0)}38%,60%{transform:translateX(-4px)}68%,90%{transform:translateX(4px)}100%{transform:translateX(0)}}
.sweat{animation:sweat 1.6s ease-in infinite}
@keyframes sweat{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(14px);opacity:0}}

/* 모드 선택 */
.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mcard{position:relative;border:3px solid var(--ink);border-radius:18px;padding:8px 4px 10px;cursor:pointer;text-align:center;box-shadow:0 5px 0 var(--ink);transition:transform .12s;background:var(--c);overflow:hidden}
.mcard::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 30%,rgba(255,255,255,.45),transparent 70%)}
.mcard .av{width:70px;margin:0 auto -2px;position:relative}
.mcard b{position:relative;display:block;font-family:var(--disp);font-weight:400;font-size:16px;color:#fff;margin-top:4px}
.mcard:not(.on){background:#fff}
.mcard:not(.on)::before{display:none}
.mcard:not(.on) b{color:#8a7cb3;text-shadow:none}
.mcard:not(.on) .av{opacity:.85;transform:scale(.92)}
.mcard.on{transform:translateY(-4px);box-shadow:0 9px 0 var(--ink)}
.mcard .chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--ink);display:none;place-items:center}
.mcard.on .chk{display:grid}
.mcard .chk svg{width:14px;height:14px;color:#fff}
.mdesc{margin-top:14px;background:var(--paper2);border-radius:14px;padding:11px 13px;font-size:14.5px;font-weight:600;line-height:1.5}
.mdesc b{font-family:var(--disp);font-weight:400;font-size:17px;display:block;color:var(--acc-d);margin-bottom:2px}

/* 인원 */
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper .ibtn{width:52px;height:52px;background:var(--yel)}
.stepper .num{font-family:var(--disp);font-size:54px;line-height:1;min-width:96px;text-align:center}
.stepper .num small{font-size:22px;margin-left:2px}
.avrow{display:flex;justify-content:center;flex-wrap:wrap;margin-top:10px;padding-left:10px}
.avrow .av{width:34px;margin-left:-10px}

/* 타일 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 4px 11px;font-family:var(--disp);font-size:16px;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:5px}
.tile.on{background:var(--acc);transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.tile svg{width:18px;height:18px}
.seg{display:flex;background:var(--paper2);border:3px solid var(--ink);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 4px 11px;font-family:var(--disp);font-size:16px;color:#6e5f95;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.seg button.on{background:var(--acc);color:var(--ink);box-shadow:0 3px 0 var(--ink),inset 0 0 0 2.5px var(--ink)}
.seg svg{width:26px;height:26px}
.gauge{display:flex;gap:3px;align-items:flex-end;height:16px}
.gauge i{width:6px;border-radius:2px;background:currentColor;opacity:.25}
.gauge i.f{opacity:1}

details.names{margin-top:12px}
details.names summary{list-style:none;cursor:pointer;font-weight:700;font-size:14.5px;color:#6e5f95;display:flex;align-items:center;gap:6px}
details.names summary::-webkit-details-marker{display:none}
.nlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.nitem{display:flex;align-items:center;gap:6px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:4px 8px 4px 4px}
.nitem .av{width:30px;flex:none}
.nitem input{border:0;outline:0;background:transparent;font-family:var(--disp);color:var(--ink);width:100%;min-width:0;font-size:15px}

/* 하단 고정 버튼 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:28px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(18,8,48,.92) 40%)}
.dock>div{max-width:448px;margin:0 auto}
.dock .btn{margin-top:0}

/* 차례 / 기밀 카드 */
.turn{text-align:center;margin-top:4px}
.turn .av{width:110px;margin:0 auto;animation:bob 2s ease-in-out infinite}
.turn h2{font-family:var(--disp);font-weight:400;font-size:40px;margin:8px 0 2px}
.turn p{margin:0;color:#d9cffc;font-weight:600}
.flip{perspective:1200px;margin:18px auto 0;width:100%;max-width:340px;height:clamp(240px,41vh,340px);cursor:pointer}
.flip.short{height:240px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:var(--ink);text-align:center}
.face.front{background:#e9b86a;background-image:linear-gradient(#f2c77c,#d9a352)}
.face.front::before{content:"";position:absolute;top:-3px;left:24px;width:44%;height:30px;background:#f2c77c;border:3px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;display:none}
.face.front .seal{width:96px;height:96px;border-radius:50%;background:var(--red);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 5px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.18);color:#fff}
.face.front .seal svg{width:52px;height:52px}
.face.front .ts{position:absolute;top:22px;right:-36px;transform:rotate(35deg);background:var(--ink);color:var(--yel);font-family:var(--disp);font-size:13px;letter-spacing:3px;padding:4px 44px}
.face.front .lines{position:absolute;left:20px;right:20px;bottom:22px;display:grid;gap:7px}
.face.front .lines i{height:6px;border-radius:3px;background:rgba(27,16,56,.15)}
.face.front .lines i:nth-child(2){width:70%}
.face.front h3{font-family:var(--disp);font-weight:400;font-size:24px;margin:18px 0 2px}
.face.front p{margin:0;font-weight:700;font-size:14px;opacity:.75}
.face.back{transform:rotateY(180deg);background:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,rgba(27,16,56,.07) 31px 33px)}
.face.back.liar{background:#2a1450;color:#fff;background-image:repeating-linear-gradient(-45deg,rgba(255,71,102,.12) 0 12px,transparent 12px 30px)}
.catTag{display:inline-block;background:var(--ink);color:#fff;font-family:var(--disp);font-size:16px;padding:4px 14px 6px;border-radius:10px}
.face.back.liar .catTag{background:var(--red);color:#fff;border:2.5px solid #fff}
.secret{font-family:var(--disp);font-size:52px;line-height:1.05;margin:16px 0 10px;word-break:keep-all}
.secret.long{font-size:36px}
.face .note{font-size:14px;font-weight:700;opacity:.65;margin:0}
.face.back .stamp{position:absolute;top:16px;right:14px;font-family:var(--disp);font-size:15px;color:var(--red);border:3px solid var(--red);border-radius:8px;padding:1px 8px 3px;transform:rotate(12deg);opacity:.8}
.face.back.liar .av{width:120px}
.liarT{font-family:var(--disp);font-size:42px;color:var(--red);margin:6px 0 6px}
.tapme{animation:tapme 1.6s ease-in-out infinite}
@keyframes tapme{50%{transform:scale(1.03) rotate(-1deg)}}

/* 진행 화면 */
.order{display:flex;gap:4px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none}
.order::-webkit-scrollbar{display:none}
.order .o{flex:none;width:52px;text-align:center;position:relative}
.order .o .av{width:46px;margin:0 auto}
.order .o span{display:block;font-family:var(--disp);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order .o.st .flag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--acc);border:2px solid var(--ink);border-radius:6px;font-family:var(--disp);font-size:10px;padding:0 5px 1px;z-index:1}
.order .arr{flex:none;align-self:center;color:#b3a6d6;margin-top:-14px}
.tips{display:grid;gap:8px;margin-top:12px}
.tips div{display:flex;gap:10px;align-items:flex-start;background:var(--paper2);border-radius:12px;padding:9px 11px;font-size:14.5px;font-weight:600}
.tips em{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:13px}
.qtext{font-family:var(--disp);font-size:30px;line-height:1.2;margin:4px 0 14px;word-break:keep-all}
.s10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.s10 i{font-style:normal;aspect-ratio:1/1.15;border:2.5px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-family:var(--disp);font-size:15px;color:var(--ink)}
.slbl{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-weight:800;font-size:14px}
.slbl span:last-child{text-align:right}
.callout{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14.5px}
.callout svg{width:30px;height:30px;flex:none;color:var(--yel)}
.qnav{display:flex;gap:6px;justify-content:center;margin-top:12px}
.qnav i{width:9px;height:9px;border-radius:50%;background:var(--paper3)}
.qnav i.on{background:var(--ink);width:24px;border-radius:5px}

/* 분포도 */
.plot{margin-top:14px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:10px 6px 6px}
.plot .cols{display:grid;grid-template-columns:repeat(10,1fr);align-items:end;min-height:40px}
.plot .col{display:flex;flex-direction:column-reverse;align-items:center}
.plot .col .av{width:28px;margin-top:-6px}
.plot .col .av.l{filter:drop-shadow(0 0 0 var(--red))}
.plot .axis{display:grid;grid-template-columns:repeat(10,1fr);border-top:2.5px solid var(--ink);margin-top:4px;padding-top:3px;font-family:var(--disp);font-size:13px;text-align:center}
.plot .exp{display:grid;grid-template-columns:repeat(10,1fr);margin-top:4px;font-size:11px;font-weight:800;text-align:center;line-height:1.1}
.plot .exp span{position:relative;padding-top:9px;white-space:nowrap}
.plot .exp span::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:currentColor;border-top:0}
.plot .exp span:not(.a):not(.b)::before{display:none}
.plot .exp .a{color:var(--grn-d)}.plot .exp .b{color:var(--red)}

/* 타이머 */
.timer{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:24px;font-variant-numeric:tabular-nums}
.ring.end .t{color:var(--red);animation:blink .5s infinite}
@keyframes blink{50%{opacity:.25}}
.timer .ctl{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer .ctl .btn{margin:0;font-size:16px;padding:9px 6px 11px;border-radius:14px;box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.14)}
.timer .ctl .btn:first-child{grid-column:1/-1}

/* 숫자 입력 */
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:16px}
.pad button{aspect-ratio:1;border:3px solid var(--ink);border-radius:16px;font-family:var(--disp);font-size:28px;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.12);background:#fff}
.pad button.on{background:var(--acc);transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}

/* 투표 */
.lineupbg{position:relative;margin-top:14px;border:3px solid var(--ink);border-radius:24px;padding:18px 10px 14px;box-shadow:0 7px 0 var(--ink);
 background:#2b1b63;background-image:repeating-linear-gradient(transparent 0 27px,rgba(255,255,255,.12) 27px 29px)}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px}
.vgrid.n4{grid-template-columns:repeat(4,1fr)}
.sus{cursor:pointer;text-align:center;border-radius:16px;padding:6px 2px 6px;border:3px solid transparent;transition:transform .15s}
.sus .av{width:72%;margin:0 auto}

const store={get(k,d){try{const v=localStorage.getItem('liar.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('liar.'+k,JSON.stringify(v))}catch(e){}}};
let actx=null,muted=store.get('mute',false);
function ac(){const A=window.AudioContext||window.webkitAudioContext;if(!actx&&A)actx=new A();if(actx&&actx.state==='suspended')actx.resume();return actx}
function tone(f,d,{type='sine',v=.2,to=null,at=0}={}){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,{v=.2,at=0,hp=800}={}){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+at,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(t)}
const sfx={

/* ───────── 시드 난수 (같은 코드 = 모든 폰에서 같은 결과) ───────── */
function hash(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^h>>>16)>>>0}
function rng(...k){let a=hash(k.join('|'));return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=(arr,r)=>arr[Math.floor(r()*arr.length)];

/* 코드 6글자 = 30비트: 모드2·인원4·주제6·옵션5·시드13
   옵션 — 스파이: 난이도2·스파이 수2 / 라이어·바보: 미션1·힌트1·라이어 수2·공범1 */
const ABC='23456789ABCDEFGHJKLMNPQRSTUVWXYZ',RANDOM=63,CODE_LEN=6;
const maxLiars=(n,acc)=>Math.max(1,Math.min(3,Math.floor((n-(acc?1:0)-1)/2)));
function packOpt(c){return c.mode==='spy'?(c.diff|((c.liars-1)<<2)):((c.mission?1:0)|(c.hint?2:0)|((c.liars-1)<<2)|(c.acc?16:0))}
function unpackOpt(mode,o){const liars=((o>>2)&3)+1;return mode==='spy'?{diff:o&3,liars,mission:false,hint:false,acc:!!(o&16)}:{diff:0,mission:!!(o&1),hint:!!(o&2),liars,acc:!!(o&16)}}
function encode(c){let v=(((MODE_KEYS.indexOf(c.mode)*16+(c.n-3))*64+c.cat)*32+packOpt(c))*8192+c.seed,s='';for(let i=0;i<CODE_LEN;i++){s=ABC[v%32]+s;v=Math.floor(v/32)}return s}
function cleanCode(s){return(s||'').toUpperCase().replace(/O/g,'0').replace(/[I1]/g,'L').replace(/[^0-9A-Z]/g,'').slice(0,CODE_LEN)}
function decode(s){s=cleanCode(s);if(s.length!==CODE_LEN)return null;let v=0;for(const ch of s){const i=ABC.indexOf(ch);if(i<0)return null;v=v*32+i}
 const seed=v%8192;v=Math.floor(v/8192);const o=v%32;v=Math.floor(v/32);const cat=v%64;v=Math.floor(v/64);const n=v%16+3;const mode=MODE_KEYS[Math.floor(v/16)];
 if(!mode)return null;const op=unpackOpt(mode,o);
 if(op.diff>2||op.liars>maxLiars(n,op.acc)||(op.acc&&(mode!=='liar'||n<5))||(op.hint&&mode!=='liar'))return null;
 const cats=mode==='spy'?SPYC:LIARC;if(cat!==RANDOM&&cat>=cats.length)return null;return{mode,n,cat,seed,...op}}

/* ───────── 라운드 만들기 ───────── */
const candCache={};
function spyCands(ci,d,seed){
 const key=ci+'/'+d+'/'+seed;if(candCache[key])return candCache[key];
 const C=SPYC[ci],{gap:[lo,hi],sim}=DIFFS[d],r=rng(seed,'sp',ci,d),out=[];
 for(let i=0;i<C.w.length;i++)for(let j=i+1;j<C.w.length;j++){
  const df=C.w[i].v.map((x,k)=>Math.abs(x-C.w[j].v[k]));
  const avg=df.reduce((a,b)=>a+b,0)/df.length;
  const first=df.map((x,k)=>k).filter(k=>df[k]>=lo&&df[k]<=hi);
  if(!first.length||avg>sim)continue;
  const q1=pick(first,r);
  let rest=shuffle(df.map((x,k)=>k).filter(k=>k!==q1&&df[k]>=Math.max(2,lo-1)&&df[k]<=hi+1),r);
  if(rest.length<2)rest=rest.concat(df.map((x,k)=>k).filter(k=>k!==q1&&!rest.includes(k)&&df[k]>=2).sort((a,b)=>df[b]-df[a]));
  if(rest.length<2)continue; // 쓸 만한 질문(간극 2 이상)이 3개 안 되는 짝은 버린다
  out.push({i,j,qs:[q1,...rest.slice(0,2)]});
 }
 return candCache[key]=shuffle(out,r);
}
const letters=w=>[...w.replace(/\s/g,'')].length;
/* recent: 폰 돌리기 모드에서만 — 최근 판에 나온 단어를 피한다(각자 폰 모드는 모든 폰이 같은 결과를 내야 하므로 쓰지 않음) */
function genRound(cfg,round,recent){
 const spy=cfg.mode==='spy',cats=catsOf(cfg);
 const order=shuffle(cats.map((_,i)=>i),rng(cfg.seed,'cats',cats.length));
 const catOf=x=>cfg.cat===RANDOM||cfg.cat>=cats.length?order[x%cats.length]:cfg.cat;
 const c=catOf(round);let k=0;for(let x=0;x<round;x++)if(catOf(x)===c)k++;
 const rr=rng(cfg.seed,'round',round,cfg.mode);
 const people=shuffle([...Array(cfg.n).keys()],rr);
 const liars=people.slice(0,cfg.liars).sort((a,b)=>a-b);
 const acc=cfg.acc?people[cfg.liars]:-1;
 let starter=Math.floor(rr()*cfg.n);
 if(cfg.mode==='liar')for(let t=0;t<cfg.n&&liars.includes(starter);t++)starter=(starter+1)%cfg.n;
 const mission=!spy&&cfg.mission?pick(MISSIONS,rng(cfg.seed,'mission',round)):null;
 const intro=pick(INTROS,rng(cfg.seed,'intro',round));
 const base={cat:cats[c].name,icon:cats[c].icon,liars,acc,starter,mission,intro,rev:!!(mission&&mission[0]==='거꾸로 돌기')};
 if(!spy){
  const words=shuffle(cats[c].w,rng(cfg.seed,'w',c,cats[c].name));
  const used=new Set(recent?recent(cfg.mode+':'+cats[c].name):[]);
  const word=recent?(words.find(w=>!used.has(w))||words[0]):words[k%words.length];
  let lw=null;
  if(cfg.mode==='fool'){const others=cats[c].w.filter(x=>x!==word),usedL=new Set(recent?recent(cfg.mode+':'+cats[c].name+':lw'):[]);const fresh=others.filter(x=>!used.has(x)&&!usedL.has(x));lw=pick(fresh.length?fresh:others,rr)}
  return{...base,word,lw,hint:cfg.hint?letters(word):0,qs:[]};
 }
 const C=SPYC[c],cands=spyCands(c,cfg.diff,cfg.seed);
 let p=cands[k%cands.length];
 if(recent){const used=new Set(recent('spy:'+C.name));p=cands.find(x=>!used.has(C.w[x.i].name)&&!used.has(C.w[x.j].name))||cands.find(x=>!used.has(C.w[x.i].name+'|'+C.w[x.j].name))||p}
 const flip=rr()<.5,a=flip?p.j:p.i,b=flip?p.i:p.j;
 return{...base,word:C.w[a].name,lw:C.w[b].name,hint:0,
  qs:p.qs.map(q=>({t:C.q[q][0],lo:C.q[q][1],hi:C.q[q][2],a:C.w[a].v[q],b:C.w[b].v[q]}))};
}
/* 최근에 나온 단어 기록(이 브라우저에만) */
const RECENT=store.get('recent',{});
const recentOf=key=>RECENT[key]||[];
function remember(key,words,cap){const a=(RECENT[key]||[]).filter(w=>!words.includes(w));a.push(...words);RECENT[key]=a.slice(-cap);store.set('recent',RECENT)}
function rememberRound(){
 const R=G.R,m=G.cfg.mode,cat=catsOf(G.cfg).find(c=>c.name===R.cat);if(!cat)return;
 const cap=Math.max(3,Math.floor(cat.w.length*.7));
 if(m==='spy')remember('spy:'+R.cat,[R.word,R.lw,[R.word,R.lw].sort().join('|')],cap+8);
 else{remember(m+':'+R.cat,[R.word],cap);if(R.lw)remember(m+':'+R.cat+':lw',[R.lw],Math.floor(cap/2))}
}

/* ───────── 타이머 ───────── */
const T={left:120,total:120,run:false,last:0,id:null,lastSec:0};
function resetTimer(){T.left=T.total=S.time||120;T.run=false;clearInterval(T.id);T.id=null}
function tick(){if(!T.run)return;const now=Date.now();T.left-=(now-T.last)/1000;T.last=now;const s=Math.ceil(T.left);
 if(s!==T.lastSec){T.lastSec=s;if(s<=10&&s>0)sfx.tick()}
 if(T.left<=0){T.left=0;T.run=false;sfx.alarm();buzz([300,150,300])}drawTimer()}
function drawTimer(){const el=document.getElementById('tt');if(!el)return;const s=Math.ceil(T.left);el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
 const ring=document.getElementById('tring');ring.classList.toggle('end',T.left<=0);
 const arc=document.getElementById('tarc');arc.style.strokeDashoffset=String(251.3*(1-T.left/T.total));arc.style.stroke=T.left<=10?'var(--red)':'var(--acc)';
 document.getElementById('tb').innerHTML=(T.run?IC.pause:IC.play)+`<span class="lbl">${T.run?'일시정지':(T.left<T.total&&T.left>0?'계속':'토론 시작')}</span>`}
function timerToggle(){if(T.left<=0){T.left=T.total}T.run=!T.run;T.last=Date.now();if(!T.id)T.id=setInterval(tick,200);drawTimer()}
function timerAdd(s){T.left=Math.max(0,T.left+s);if(T.left>T.total)T.total=T.left;drawTimer()}

function set(k,v){S[k]=v;if(k==='mode'&&S.cat!==RANDOM)S.cat=RANDOM;if(k==='play'&&v==='own'&&S.cat>=LIARC.length&&S.cat!==RANDOM)S.cat=RANDOM;saveCfg();const y=window.scrollY;render();window.scrollTo(0,y)}
function start(){
 const lm=S.mode==='liar',spy=S.mode==='spy',acc=lm&&S.acc&&S.n>=5;
 const cfg={mode:S.mode,n:S.n,cat:S.cat,seed:Math.floor(Math.random()*8192),diff:spy?S.diff:0,mission:!spy&&!!S.mission,hint:lm&&!!S.hint,liars:Math.min(S.liars||1,maxLiars(S.n,acc)),acc,local:S.play!=='own'};
 if(!cfg.local&&cfg.cat!==RANDOM&&cfg.cat>=(spy?SPYC:LIARC).length)cfg.cat=RANDOM;
 newGame(cfg,!cfg.local,null);
 if(G.own)go('code');else startRound();
}
function quit(){if(scr==='title')return;if(!G||confirm('게임을 끝내고 처음 화면으로 갈까요?')){resetTimer();G=null;go('title')}}
function catLabel(c){const cats=catsOf(c);const r=MODES[c.mode].role;return[(c.cat===RANDOM?'랜덤 주제':cats[c.cat].name),c.mode==='spy'?DIFFS[c.diff].name:'',c.liars>1?`${r} ${c.liars}명`:'',c.acc?'공범':'',c.hint?'힌트':'',c.mission?'미션':''].filter(Boolean).join(' · ')}

function introFx(){
 const slot=document.getElementById('slot');if(!slot)return;
 if(G.cfg.cat!==RANDOM||G.rolled){sfx.flip();return}
 const keys=shuffle([...new Set(catsOf(G.cfg).map(c=>c.icon))],Math.random);let i=0,delay=55;
 const step=()=>{if(scr!=='intro'||!document.getElementById('slot'))return;
  if(delay>260){G.rolled=true;slot.classList.remove('rolling');slot.innerHTML=ico(G.R.icon);slot.classList.remove('landed');void slot.offsetWidth;slot.classList.add('landed');
   document.getElementById('catname').textContent=G.R.cat;sfx.reveal();buzz(30);return}
  slot.innerHTML=ico(keys[i++%keys.length]);sfx.tick();delay*=1.13;setTimeout(step,delay)};
 step();

 let back;
 if(m==='liar'&&isL)back=`<div class="face back liar"><span class="catTag">주제 · ${esc(R.cat)}</span><div class="lav">${avatar(i,{d:true,hat:false,color:'#ff5a76'})}</div><div class="liarT ol-s" style="color:#fff">당신은 <span style="color:var(--red)">라이어</span></div><p class="note">${R.hint?`<b class="hintb">힌트: 제시어는 ${R.hint}글자</b><br>`:''}제시어를 모릅니다. 들키지 말고 알아내세요.${k>1?`<br>라이어는 모두 ${k}명이에요.`:''}</p></div>`;
 else if(m==='liar'&&i===R.acc)back=`<div class="face back acc"><span class="catTag">주제 · ${esc(R.cat)}</span><div class="liarT ol-s" style="color:#fff;margin-top:8px">당신은 <span style="color:var(--pur2)">공범</span></div><div class="secret sm">${esc(R.word)}</div><p class="note">라이어 편! 라이어가 누군지는 몰라요.<br>시민을 헷갈리게 하세요. 라이어가 이기면 함께 이겨요.</p></div>`;
 else{const w=isL?R.lw:R.word;back=`<div class="face back"><span class="stamp">기밀</span>${ico(R.icon,'cardi')}<span class="catTag">주제 · ${esc(R.cat)}</span><div class="secret ${letters(w)>6?'long':''} ${letters(w)>10?'xl':''}">${esc(w)}</div><p class="note">${m==='liar'?`라이어${k>1?' '+k+'명':''}은 이 단어를 모릅니다${G.cfg.acc?' · 공범은 알아요':''}`:m==='fool'?'혹시 나만 다른 단어일 수도…?':`${k>1?k+'명':'한 명'}은 다른 단어를 받았어요. 나일 수도…?`}</p></div>`}
 return`<div class="flip ${short?'short':''}" id="card" onclick="flipCard()"><div class="in">
 <div class="face front tapme"><span class="ts">TOP SECRET</span><div class="seal">${IC.lock}</div><h3>${hint||'탭해서 제시어 확인'}</h3><p>다른 사람이 못 보게 조심!</p><div class="lines"><i></i><i></i></div></div>
 ${back}</div></div>`;
}

 <p class="why" style="margin-top:-6px">하나, 둘, 셋에 동시에 손가락으로 지목!<br>가장 많이 지목된 사람을 고르세요.</p>
 <div class="lineupbg"><div class="vgrid ${n>=7&&n!==9?'n4':''}">${Array.from({length:n},(_,i)=>G.caught.includes(i)?`<div class="sus out">${avatar(i,{d:true,hat:false})}<b>검거됨</b></div>`:`<div class="sus ${G.sel===i?'on':G.sel!=null?'dim':''}" onclick="G.sel=${i};sfx.pick();render()">${avatar(i,{look:G.sel===i?0:(i%3===0?1:i%3===1?0:-1),sweat:G.sel===i})}<b>${esc(nameOf(i))}</b></div>`).join('')}</div></div>
 <p class="center" style="font-size:13px;color:#cfc4f7;font-weight:600;margin-top:16px">동점이면 동점자끼리 한 번 더 변론하고 다시 지목하세요.</p>
 <div class="dock"><div><button class="btn red" ${G.sel==null?'disabled':''} onclick="accuse()">${IC.vote}<span class="lbl">${G.sel==null?'용의자를 고르세요':esc(nameOf(G.sel))+' 지목!'}</span></button></div></div>`};
function accuse(){if(G.sel==null||G.busy)return;G.busy=true;G.accused=G.sel;resetTimer();sfx.drum();go('suspense');
 setTimeout(()=>{G.busy=false;if(scr!=='suspense')return;if(isLiar(G.accused)&&!G.caught.includes(G.accused)){sfx.stamp();buzz(120);G.guess=false;go('caught')}else finish('l')},1650)}
SCREENS.suspense=()=>`${hud(roundPill(),spacer)}
 <div class="stage" style="margin-top:30px"><div class="spot"></div><div class="tremble" style="width:170px;margin:0 auto">${avatar(G.accused,{sweat:true})}</div></div>
 <div class="sushead ol">${esc(nameOf(G.accused))}님은<br>과연<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`;

SCREENS.caught=()=>{
 const R=G.R,m=G.cfg.mode,a=G.accused,left=G.cfg.liars-G.caught.length-1;
 return`${hud(roundPill(),spacer)}
 <div class="stage shake"><div class="spot"></div><div class="av" style="width:170px;margin:0 auto">${avatar(a,{d:true,hat:false})}</div><div class="stamp2">검거</div><div class="cuffs">${ico('handcuffs')}</div></div>
 <div class="sushead ol" style="margin-top:6px">${esc(nameOf(a))}님이 ${role()}!</div>
 ${m!=='liar'?`<p class="why" style="margin-top:2px">${role()}가 받은 단어는 <b style="color:#ff8aa0;font-family:var(--disp);font-size:20px">${esc(R.lw)}</b></p>`:''}
 <section class="panel"><div class="ptab acc">마지막 기회</div>
 <p style="font-weight:700">${role()}는 ${m==='liar'?'제시어를':'다른 사람들의 제시어를'} 소리 내어 맞혀 보세요.</p>
 <p class="sub">기회는 한 번! 답을 말한 뒤 정답을 공개합니다.${left>0?` 틀리면 남은 ${role()} ${left}명을 계속 찾아요.`:''}</p>
 ${G.guess?`<div class="secret center" style="margin:14px 0 4px;animation:pop .45s both">${esc(R.word)}</div>
 <div class="row"><button class="btn red" onclick="finish('l')"><span class="lbl">맞혔다!</span></button><button class="btn grn" onclick="wrongGuess()"><span class="lbl">틀렸다</span></button></div>`
 :`<button class="btn yel" onclick="G.guess=true;sfx.reveal();render()">${IC.eye}<span>정답 공개</span></button>`}
 </section>`;
};
function wrongGuess(){if(G.done)return;G.caught.push(G.accused);if(G.caught.length>=G.cfg.liars)finish('c');else{G.sel=null;sfx.reveal();go('play');toast(`남은 ${role()} ${G.cfg.liars-G.caught.length}명! 다시 토론하세요`)}}
function finish(w){if(G.done)return;G.done=true;const R=G.R;G.win=w;G.tally[w]++;
 G.delta=G.pts.map((_,i)=>w==='c'?(isLiar(i)||i===R.acc?0:1):(isLiar(i)?3:i===R.acc?2:0));G.delta.forEach((d,i)=>G.pts[i]+=d);
 G.history.push({round:G.round+1,cat:R.cat,word:R.word,win:w,liars:R.liars.slice()});
 if(S.penalty)G.pen=pick(PENALTIES,Math.random);
 go('result');if(w==='c'){sfx.win();confetti()}else{sfx.lose();setTimeout(()=>confetti(40),200)}}

SCREENS.result=()=>{
 const R=G.R,m=G.cfg.mode,lw=G.win==='l',a=G.accused,innocent=!isLiar(a)||(G.caught.includes(a)&&!lw&&false),rl=role(),multi=R.liars.length>1;
 const wrongPick=!isLiar(a);
 const st=wrongPick?['도주 성공','y']:lw?['역전승','y']:['검거',''];
 const why=wrongPick?`<b class="nm">${esc(nameOf(a))}</b>님은 ${a===R.acc?'라이어의 공범':'억울한 시민'}이었습니다!`:lw?`<b class="nm">${esc(nameOf(a))}</b>님이 제시어를 맞혔습니다!`:multi?`${rl}를 모두 잡았습니다!`:`${rl}가 제시어를 못 맞혔습니다.`;
 let h=`${hud(roundPill())}
 <div class="ribbon" style="--c:${lw?'var(--red)':'var(--grn)'};--cd:${lw?'var(--red-d)':'var(--grn-d)'}"><span class="ol-s">${lw?rl+' 승리':'시민 승리'}</span></div>
 <div class="stage" style="margin-top:20px"><div class="spot"></div><div class="lrow">${R.liars.map(i=>`<div class="av">${avatar(i,{d:true,hat:false})}</div>`).join('')}</div><div class="stamp2 ${st[1]}" style="font-size:38px">${st[0]}</div></div>
 <p class="why">${why}</p>
 <section class="panel"><div class="ptab">정답 공개</div><div class="facts">
 <div class="fact"><span>${rl}</span><b class="who r">${R.liars.map(i=>avatar(i,{hat:false})).join('')}${esc(namesOf(R.liars))}</b></div>
 ${R.acc>=0?`<div class="fact"><span>공범</span><b class="who" style="color:var(--pur2)">${avatar(R.acc,{hat:false})}${esc(nameOf(R.acc))}</b></div>`:''}
 <div class="fact"><span>주제</span><b>${esc(R.cat)}</b></div>
 <div class="fact"><span>시민 제시어</span><b>${esc(R.word)}</b></div>
 ${m!=='liar'?`<div class="fact"><span>${rl}의 단어</span><b class="r">${esc(R.lw)}</b></div>`:''}
 ${R.mission?`<div class="fact"><span>미션</span><b style="font-size:17px">${R.mission[0]}</b></div>`:''}
 </div></section>`;
 if(m==='spy')h+=R.qs.map((q,k)=>`<section class="panel"><div class="ptab">질문 ${k+1} · 간극 ${Math.abs(q.a-q.b)}</div><p style="font-family:var(--disp);font-size:20px;margin:2px 0 0">${esc(q.t)}</p>
  ${plotHTML(k,true)}<p class="hint">▲ 표시는 그 단어를 받은 보통 사람이 낼 법한 숫자예요.</p></section>`).join('');
 if(G.pen)h+=`<section class="panel pen"><div class="ptab acc">${ico('stamp')}벌칙</div><p class="sub">벌칙 대상 · <b>${lw?'시민 팀':esc(namesOf(R.liars))+(R.acc>=0?', '+esc(nameOf(R.acc)):'')}</b></p><div class="pentext" id="pentext">${esc(G.pen)}</div><button class="btn sm paper" onclick="G.pen=pick(PENALTIES.filter(p=>p!==G.pen),Math.random);document.getElementById('pentext').textContent=G.pen;sfx.pick()">${IC.reset}<span>다시 뽑기</span></button></section>`;
 const rank=G.pts.map((p,i)=>({p,i})).sort((a,b)=>b.p-a.p||a.i-b.i);
 h+=`<div class="score"><div><b style="color:var(--grn)">${G.tally.c}</b><span>시민</span></div><div class="vs">VS</div><div><b style="color:var(--red)">${G.tally.l}</b><span>${rl}</span></div></div>
 <section class="panel"><div class="ptab">${ico('trophy')}점수판</div><div class="board">${rank.map((r,k)=>`<div class="rowp"><span class="rk">${k===0&&r.p>0?ico('trophy'):k+1}</span>${avatar(r.i)}<span class="nm2">${esc(nameOf(r.i))}</span><span class="pt">${r.p}<small>점</small></span>${G.delta[r.i]?`<span class="plus ${isLiar(r.i)||r.i===R.acc?'r':''}">+${G.delta[r.i]}</span>`:''}</div>`).join('')}</div>
 <p class="hint">시민이 이기면 시민 모두 <b>+1</b> · ${rl}가 이기면 ${rl} <b>+3</b>${G.cfg.acc?', 공범 <b>+2</b>':''}</p></section>
 <div class="row" style="margin-top:20px"><button class="btn paper sm" onclick="resetTimer();G=null;go('lobby')"><span>설정 바꾸기</span></button><button class="btn paper sm" onclick="go('final')">${ico('trophy','bi')}<span>게임 끝내기</span></button></div>
 <div class="dock"><div><button class="btn yel" onclick="G.round++;startRound()"><span class="lbl">다음 라운드</span>${IC.next}</button>
 ${G.own?'<p class="center" style="margin:8px 0 0;font-size:12.5px;color:#cfc4f7;font-weight:600">모두 같은 라운드로 넘어갔는지 확인하세요</p>':''}</div></div>`;
 return h;
};

/* 최종 순위 */
SCREENS.final=()=>{
 const rank=G.pts.map((p,i)=>({p,i})).sort((a,b)=>b.p-a.p||a.i-b.i);
 const top=rank[0].p,winners=rank.filter(r=>r.p===top&&top>0),pod=[rank[1],rank[0],rank[2]];
 setTimeout(()=>{sfx.win();confetti(90)},250);
 return`${hud('<span class="hudtitle ol-s">최종 순위</span>',spacer)}
 <div class="ribbon" style="--c:var(--yel);--cd:var(--yel-d);color:var(--ink)"><span>${winners.length?esc(winners.map(r=>nameOf(r.i)).join(', '))+' 우승!':'무승부!'}</span></div>
 <div class="podium">${pod.map((r,k)=>r?`<div class="pd p${[2,1,3][k]}"><div class="pav">${[2,1,3][k]===1?`<div class="crown">${ico('trophy')}</div>`:''}${avatar(r.i)}</div><b>${esc(nameOf(r.i))}</b><div class="bar"><span class="disp">${[2,1,3][k]}</span><small>${r.p}점</small></div></div>`:'<div class="pd"></div>').join('')}</div>
 <section class="panel"><div class="ptab">전체 순위 · ${G.history.length}라운드</div><div class="board">${rank.map((r,k)=>`<div class="rowp"><span class="rk">${k+1}</span>${avatar(r.i)}<span class="nm2">${esc(nameOf(r.i))}</span><span class="pt">${r.p}<small>점</small></span></div>`).join('')}</div></section>
 ${G.history.length?`<section class="panel"><div class="ptab">라운드 기록</div><div class="hist">${G.history.map(x=>`<div><span class="disp">R${x.round}</span><span>${esc(x.cat)} · <b>${esc(x.word)}</b></span><em class="${x.win==='c'?'c':'l'}">${x.win==='c'?'시민':'라이어'}</em></div>`).join('')}</div></section>`:''}
 <div class="dock"><div><button class="btn yel" onclick="const c=G.cfg;newGame({...c,seed:Math.floor(Math.random()*8192)},G.own,G.me);if(G.own)go('code');else startRound()"><span class="lbl">같은 멤버로 새 게임</span></button>
 <button class="btn paper sm" onclick="G=null;go('title')"><span>처음으로</span></button></div></div>`;
};

render();
</script>
</body>
</html>
